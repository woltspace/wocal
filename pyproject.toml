[project]
name = "wocal"
version = "0.1.0"
description = "Local vocal wolts: speech and transcription on your own Mac, behind one OpenAI-style server."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "mlx-audio[stt]==0.6.1",
    "pocket-tts==4.0.1",
    "python-multipart>=0.0.22",
    "scipy>=1.10",
    "uvicorn>=0.30",
]

[project.scripts]
wocal = "wocal.cli:main"

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
